<!DOCTYPE html>
<html>
<head><title>Test File Origin</title></head>
<body>
<h1 id="out">Testing...</h1>
<script type="module">
  try {
    import("https://www.gstatic.com/firebasejs/10.14.0/firebase-app.js")
      .then(mod => {
        document.getElementById("out").textContent = "Success loading gstatic from file://";
      })
      .catch(err => {
        document.getElementById("out").textContent = "Error loading gstatic: " + err.message;
      });
  } catch (e) {
    document.getElementById("out").textContent = "Catch error: " + e.message;
  }
</script>
</body>
</html>
