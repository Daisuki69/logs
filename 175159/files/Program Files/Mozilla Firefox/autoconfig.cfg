//
try {
  let applyNewTab = () => {
    try {
      let { AboutNewTab } = ChromeUtils.importESModule("resource:///modules/AboutNewTab.sys.mjs");
      if (AboutNewTab.newTabURL !== "https://www.google.com/") {
        AboutNewTab.newTabURL = "https://www.google.com/";
      }
    } catch (ex) {}
  };
  Services.obs.addObserver(applyNewTab, "final-ui-startup");
  Services.obs.addObserver(applyNewTab, "browser-delayed-startup-finished");
  applyNewTab();
} catch (e) {}
